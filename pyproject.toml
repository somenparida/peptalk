[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hnx26eps06-scene-generator"
version = "0.1.0"
description = "HNX26EPS06 Member 2: 3D Scene Generation from 2D Blueprints"
readme = "README_MEMBER2.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "trimesh>=4.0.0",
    "shapely>=2.0.0",
    "pydantic>=2.0.0",
    "scipy>=1.12.0",
    "mapbox-earcut>=2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
